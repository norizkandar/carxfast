
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080b12">
<meta name="description" content="INOVAX Street Legends — an open-world 3D street racing prototype.">
<title>INOVAX: Street Legends</title>

<style>
:root{--blue:#65d7ff;--glass:rgba(8,14,25,.78)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b12;color:white;font-family:Arial,Helvetica,sans-serif}
body{user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
button{font:inherit;color:white;cursor:pointer;touch-action:none}
#loading{position:fixed;inset:0;z-index:20;background:#080b12;display:grid;place-content:center;text-align:center;gap:14px}
#loading h1{font-size:clamp(38px,8vw,76px);font-style:italic;letter-spacing:8px;margin:0;font-weight:1000}
#loading p{color:var(--blue);letter-spacing:5px;font-size:12px}
#loading small{color:#a3b4c8;letter-spacing:2px}
#start{margin-top:20px;background:var(--blue);color:#07111b;border:0;border-radius:5px;padding:16px 32px;font-weight:900;letter-spacing:2px}
#hud{position:fixed;inset:0;z-index:2;pointer-events:none}
.brand{position:absolute;top:22px;left:24px;font-weight:1000;font-size:24px;letter-spacing:4px;font-style:italic;text-shadow:0 2px 12px #000}
.brand small{display:block;font-size:9px;letter-spacing:4px;color:var(--blue);font-style:normal;margin-top:5px}
.topright{position:absolute;right:20px;top:20px;display:flex;gap:8px;pointer-events:auto}
.ui-btn{background:var(--glass);border:1px solid #ffffff35;border-radius:5px;padding:11px 14px;font-size:10px;letter-spacing:1px;backdrop-filter:blur(12px)}
.ui-btn:active{border-color:var(--blue);color:var(--blue)}
#mission{position:absolute;top:105px;left:24px;padding:12px 15px;border-left:2px solid var(--blue);background:linear-gradient(90deg,#08111bd9,transparent);font-size:11px;line-height:1.8}
#mission strong{letter-spacing:2px}
#mission span{display:block;color:#b6c4d6}
#speedbox{position:absolute;right:24px;bottom:25px;text-align:right;padding:16px 20px;background:var(--glass);border:1px solid #ffffff25;border-radius:10px;min-width:150px;backdrop-filter:blur(10px)}
#speed{font-size:53px;line-height:1;font-weight:900;font-style:italic}
#speedbox small{color:var(--blue);letter-spacing:4px;font-size:10px}
#gear{font-size:11px;color:#a9b8c9;margin-top:7px}
#help{position:absolute;left:24px;bottom:25px;color:#e0e7f1;font-size:10px;line-height:2;text-shadow:0 2px 8px black}
#help b{color:var(--blue)}
#toast{position:absolute;top:24%;left:50%;transform:translateX(-50%);padding:12px 20px;background:#06101ddd;border:1px solid #65d7ff60;letter-spacing:2px;font-size:11px;opacity:0;transition:opacity .2s;white-space:nowrap}
#touch{position:fixed;z-index:4;bottom:18px;left:0;right:0;display:none;justify-content:space-between;padding:0 15px;pointer-events:none}
.pad{display:flex;gap:8px}
.ctrl{pointer-events:auto;width:57px;height:57px;border:1px solid #ffffff55;border-radius:13px;background:#08111bd9;font-size:20px;backdrop-filter:blur(8px)}
.ctrl:active{background:#17618a}
#footnote{position:fixed;z-index:2;bottom:7px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:2px;color:#ffffff66;white-space:nowrap;pointer-events:none}
@media(max-width:700px){
 .brand{top:15px;left:14px;font-size:19px}
 .topright{top:14px;right:12px;gap:5px}
 .ui-btn{padding:10px 9px;font-size:9px}
 #mission{left:14px;top:90px;font-size:9px}
 #speedbox{right:13px;bottom:95px;min-width:108px;padding:11px}
 #speed{font-size:37px}
 #help{left:14px;bottom:104px;font-size:8px}
 #touch{display:flex}
 #footnote{display:none}
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>

<div id="loading">
  <h1>INOVA<span style="color:#65d7ff">X</span></h1>
  <p>STREET LEGENDS</p>
  <small id="loadStatus">INITIALISING 3D WORLD...</small>
  <button id="start">ENTER THE CITY ↗</button>
</div>

<div id="hud">
  <div class="brand">INOVAX<small>STREET LEGENDS / OPEN WORLD</small></div>

  <div class="topright">
    <button class="ui-btn" id="cameraBtn">CAMERA: CHASE</button>
    <button class="ui-btn" id="timeBtn">☀ DAY</button>
    <button class="ui-btn" id="resetBtn">RESET ↻</button>
  </div>

  <div id="mission">
    <strong>FREE ROAM</strong>
    <span>EXPLORE THE CITY</span>
    <span id="worldLabel">WORLD / DAYLIGHT</span>
  </div>

  <div id="speedbox">
    <div id="speed">000</div>
    <small>KM/H</small>
    <div id="gear">GEAR D · SPORT</div>
  </div>

  <div id="help">
    <b>W / ↑</b> ACCELERATE<br>
    <b>S / ↓</b> BRAKE / REVERSE<br>
    <b>A D / ← →</b> STEER<br>
    <b>C</b> CAMERA &nbsp; <b>N</b> DAY / NIGHT<br>
    <b>R</b> RESET CAR
  </div>
  <div id="toast"></div>
</div>

<div id="touch">
  <div class="pad">
    <button class="ctrl" data-key="left">◀</button>
    <button class="ctrl" data-key="right">▶</button>
  </div>
  <div class="pad">
    <button class="ctrl" data-key="brake">▼</button>
    <button class="ctrl" data-key="gas">▲</button>
  </div>
</div>
<div id="footnote">INOVAX TECHNOLOGY · THREE.JS 3D PROTOTYPE</div>

<script type="module">
import * as THREE from "three";

const $ = id => document.getElementById(id);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ac8e8);
scene.fog = new THREE.FogExp2(0x9ac8e8, 0.00165);

const camera = new THREE.PerspectiveCamera(
  65, innerWidth / innerHeight, 0.1, 1800
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xc5e4ff, 0x37413d, 2.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe5bd, 3.0);
sun.position.set(-100, 160, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(1536, 1536);
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
sun.shadow.normalBias = 0.04;
scene.add(sun);

const mat = (color, roughness=0.7, metalness=0) =>
  new THREE.MeshStandardMaterial({color, roughness, metalness});

const groundMat = mat(0x48594b);
const roadMat = mat(0x20252d, 0.82);
const concreteMat = mat(0x555b62);
const laneMat = mat(0xf3e6bd);
const grassMats = [mat(0x334b39),mat(0x3d5c40),mat(0x4c6042)];
const buildingMats = [
  mat(0x7c8794,0.8),mat(0x505e6e,0.75),
  mat(0xaaa9a3,0.8),mat(0x465666,0.65),
  mat(0x776e6a,0.8),mat(0x3e4d58,0.65)
];

const ground = new THREE.Mesh(new THREE.PlaneGeometry(1800,1800),groundMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-0.2;
ground.receiveShadow=true;
scene.add(ground);

function box(parent,w,h,d,material,x,y,z,shadow=true){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
  mesh.position.set(x,y,z);
  mesh.castShadow=shadow;
  mesh.receiveShadow=true;
  parent.add(mesh);
  return mesh;
}

function plane(width,depth,material,x,y,z){
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(width,depth),material);
  mesh.rotation.x=-Math.PI/2;
  mesh.position.set(x,y,z);
  scene.add(mesh);
  return mesh;
}

// City blocks and crossing roads
for(let i=-7;i<=7;i++){
  const p=i*100;
  plane(22,1500,roadMat,p,0,0);
  plane(1500,22,roadMat,0,0,p);
  plane(0.22,1500,laneMat,p-5.8,0.012,0);
  plane(0.22,1500,laneMat,p+5.8,0.012,0);
  plane(1500,0.22,laneMat,0,0.012,p-5.8);
  plane(1500,0.22,laneMat,0,0.012,p+5.8);

  for(let k=-70;k<=70;k+=12){
    plane(0.18,4.5,laneMat,p,0.02,k*10);
    plane(4.5,0.18,laneMat,k*10,0.02,p);
  }
}

// Seeded random layout for repeatable city generation
let seed=32987;
function rnd(){
  seed=(seed*16807)%2147483647;
  return (seed-1)/2147483646;
}

const city=new THREE.Group();
scene.add(city);

const windowMats=[];
for(let i=0;i<4;i++){
  windowMats.push(new THREE.MeshStandardMaterial({
    color:[0x9bdcff,0xf8d7a0,0x7897ad,0x344c64][i],
    emissive:0x000000,
    emissiveIntensity:0.0,
    roughness:0.28,
    metalness:0.3
  }));
}

for(let gx=-7;gx<=7;gx++){
  for(let gz=-7;gz<=7;gz++){
    if(rnd()<0.12)continue;

    const cx=gx*100+(rnd()-0.5)*14;
    const cz=gz*100+(rnd()-0.5)*14;
    const count=2+Math.floor(rnd()*3);

    for(let b=0;b<count;b++){
      const w=10+rnd()*17;
      const d=10+rnd()*17;
      const h=12+rnd()*78;
      const x=cx+(rnd()-0.5)*45;
      const z=cz+(rnd()-0.5)*45;
      const building=new THREE.Group();
      building.position.set(x,0,z);
      city.add(building);

      const bm=buildingMats[Math.floor(rnd()*buildingMats.length)];
      box(building,w,h,d,bm,0,h/2,0,h<45);

      // Roof cap and facade bands
      if(h>35){
        box(building,w+0.6,0.6,d+0.6,concreteMat,0,h+0.3,0,false);
      }

      const wm=windowMats[Math.floor(rnd()*windowMats.length)];
      for(let y=4;y<h-2;y+=5){
        const rows=Math.max(1,Math.floor(w/3.3));
        for(let n=0;n<rows;n++){
          const wx=-w/2+1.8+n*(w-3.6)/Math.max(1,rows-1);
          box(building,1.05,1.7,0.07,wm,wx,y,d/2+0.05,false);
          box(building,0.07,1.7,1.05,wm,w/2+0.05,y,wx,false);
        }
      }
    }
  }
}

// Streetlights with emissive bulbs
const lampBulbMat=new THREE.MeshStandardMaterial({
  color:0xffe4a3,emissive:0xffc65c,emissiveIntensity:1.5
});
const lamps=new THREE.Group();
scene.add(lamps);

for(let p=-600;p<=600;p+=100){
  for(let side of [-1,1]){
    for(let axis of [0,1]){
      const x=axis===0?p:side*14;
      const z=axis===0?side*14:p;
      box(lamps,0.16,6,0.16,concreteMat,x,3,z,false);
      box(lamps,1.8,0.13,0.13,concreteMat,x+0.7,5.8,z,false);
      box(lamps,0.65,0.18,0.4,lampBulbMat,x+1.35,5.72,z,false);
    }
  }
}

// Decorative distant hills
const hillMat=mat(0x506a59,1);
for(let i=0;i<36;i++){
  const radius=35+rnd()*80;
  const h=20+rnd()*80;
  const hill=new THREE.Mesh(
    new THREE.ConeGeometry(radius,h,8),hillMat
  );
  const a=i/36*Math.PI*2;
  hill.position.set(Math.sin(a)*660,h/2-3,Math.cos(a)*660);
  hill.rotation.y=rnd()*Math.PI;
  scene.add(hill);
}

// Build a stylised sports car
const car=new THREE.Group();
scene.add(car);

const paint=new THREE.MeshPhysicalMaterial({
  color:0xc9233f,
  metalness:0.72,
  roughness:0.22,
  clearcoat:1,
  clearcoatRoughness:0.16
});
const darkGlass=new THREE.MeshPhysicalMaterial({
  color:0x102536,
  metalness:0.4,
  roughness:0.13,
  clearcoat:1
});
const rubber=mat(0x101216,0.94);
const rimMat=mat(0xb8c4cf,0.24,0.85);
const headMat=new THREE.MeshStandardMaterial({
  color:0xffffff,emissive:0xd7f1ff,emissiveIntensity:2.2
});
const tailMat=new THREE.MeshStandardMaterial({
  color:0xff1428,emissive:0xff001a,emissiveIntensity:1.8
});

box(car,2.05,0.52,4.5,paint,0,0.82,0);
box(car,1.7,0.58,2.2,darkGlass,0,1.32,-0.22);
box(car,2.0,0.14,1.3,paint,0,1.05,-1.5);
box(car,1.85,0.12,0.75,paint,0,0.99,1.85);
box(car,1.85,0.08,0.25,rubber,0,0.57,2.05);
box(car,1.8,0.1,0.25,rubber,0,0.59,-2.05);

// Front lights and rear lights
for(const side of [-1,1]){
  box(car,0.48,0.12,0.09,headMat,side*0.66,0.94,2.26,false);
  box(car,0.42,0.12,0.09,tailMat,side*0.66,0.91,-2.26,false);
}

const wheelGroups=[];
for(const x of [-1.04,1.04]){
  for(const z of [-1.48,1.48]){
    const wheel=new THREE.Group();
    wheel.position.set(x,0.45,z);
    car.add(wheel);

    const tyre=new THREE.Mesh(
      new THREE.CylinderGeometry(0.38,0.38,0.25,24),rubber
    );
    tyre.rotation.z=Math.PI/2;
    wheel.add(tyre);

    const rim=new THREE.Mesh(
      new THREE.CylinderGeometry(0.23,0.23,0.265,20),rimMat
    );
    rim.rotation.z=Math.PI/2;
    wheel.add(rim);

    for(let j=0;j<5;j++){
      const spoke=box(wheel,0.055,0.35,0.06,rimMat,0,0,0,false);
      spoke.rotation.x=j*Math.PI/5;
    }
    wheelGroups.push(wheel);
  }
}

const headLights=[];
for(const side of [-0.66,0.66]){
  const light=new THREE.SpotLight(0xd9eeff,0,95,Math.PI/7,0.55,1.5);
  light.position.set(side,0.95,2.1);
  light.target.position.set(side*1.2,0,-30);
  car.add(light,light.target);
  headLights.push(light);
}

car.position.set(0,0,15);

// Driving controls
const pressed={};
const keyNames={
  ArrowUp:"gas",w:"gas",
  ArrowDown:"brake",s:"brake",
  ArrowLeft:"left",a:"left",
  ArrowRight:"right",d:"right"
};

window.addEventListener("keydown",e=>{
  const key=e.key.toLowerCase();
  pressed[keyNames[e.key]||key]=true;
  if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(key))e.preventDefault();
  if(e.repeat)return;
  if(key==="c")toggleCamera();
  if(key==="n")toggleNight();
  if(key==="r")resetCar();
});

window.addEventListener("keyup",e=>{
  pressed[keyNames[e.key]||e.key.toLowerCase()]=false;
});
window.addEventListener("blur",()=>Object.keys(pressed).forEach(k=>pressed[k]=false));

document.querySelectorAll("[data-key]").forEach(btn=>{
  const key=btn.dataset.key;
  const down=e=>{e.preventDefault();pressed[key]=true;};
  const up=e=>{e.preventDefault();pressed[key]=false;};
  btn.addEventListener("pointerdown",down);
  btn.addEventListener("pointerup",up);
  btn.addEventListener("pointercancel",up);
  btn.addEventListener("pointerleave",up);
});

let cameraMode=0;
let isNight=false;
let speed=0;
let steering=0;
let started=false;
let toastTimer;

function toast(message){
  const el=$("toast");
  el.textContent=message;
  el.style.opacity="1";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.style.opacity="0",1800);
}

function toggleCamera(){
  cameraMode=(cameraMode+1)%2;
  $("cameraBtn").textContent=cameraMode===0?"CAMERA: CHASE":"CAMERA: COCKPIT";
  toast(cameraMode===0?"THIRD-PERSON CAMERA":"COCKPIT CAMERA");
}

function toggleNight(){
  isNight=!isNight;
  const sky=isNight?0x081321:0x9ac8e8;
  const fog=isNight?0x101d2d:0x9ac8e8;
  scene.background.setHex(sky);
  scene.fog.color.setHex(fog);
  scene.fog.density=isNight?0.0022:0.00165;
  sun.intensity=isNight?0.2:3;
  hemi.intensity=isNight?0.45:2;
  hemi.color.setHex(isNight?0x45618e:0xc5e4ff);
  sun.color.setHex(isNight?0x7898ff:0xffe5bd);
  headLights.forEach(l=>l.intensity=isNight?65:0);

  windowMats.forEach(m=>{
    m.emissive.setHex(isNight?0x5c3510:0x000000);
    m.emissiveIntensity=isNight?0.8:0;
  });

  $("timeBtn").textContent=isNight?"☾ NIGHT":"☀ DAY";
  $("worldLabel").textContent=isNight?"WORLD / NIGHT DRIVE":"WORLD / DAYLIGHT";
  $("mission").style.borderLeftColor=isNight?"#a6baff":"#65d7ff";
  toast(isNight?"NIGHT DRIVE ACTIVATED":"DAYLIGHT ACTIVATED");
}

function resetCar(){
  car.position.set(0,0,15);
  car.rotation.set(0,0,0);
  speed=0;
  steering=0;
  toast("VEHICLE RESET");
}

$("cameraBtn").addEventListener("click",toggleCamera);
$("timeBtn").addEventListener("click",toggleNight);
$("resetBtn").addEventListener("click",resetCar);

$("start").addEventListener("click",()=>{
  started=true;
  $("loading").style.display="none";
  toast("WELCOME TO THE CITY");
});

const clock=new THREE.Clock();
const desiredCam=new THREE.Vector3();
const lookTarget=new THREE.Vector3();
const forwardVec=new THREE.Vector3();
const smoothLook=new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.04);

  if(started){
    const gas=pressed.gas;
    const brake=pressed.brake;
    const left=pressed.left;
    const right=pressed.right;

    if(gas)speed+=27*dt;
    else if(brake)speed-=38*dt;
    else speed*=Math.pow(0.986,dt*60);

    speed=THREE.MathUtils.clamp(speed,-15,85);

    const steerInput=(left?1:0)-(right?1:0);
    steering=THREE.MathUtils.lerp(steering,steerInput,dt*4.5);

    if(Math.abs(speed)>0.3){
      car.rotation.y+=steering*dt*Math.min(Math.abs(speed)/13,2.1)*Math.sign(speed);
      forwardVec.set(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
      car.position.addScaledVector(forwardVec,speed*dt*0.75);
    }

    wheelGroups.forEach(w=>{
      w.rotation.x+=speed*dt*0.7;
    });

    if(cameraMode===0){
      desiredCam.set(0,5.1,-11.5).applyAxisAngle(
        new THREE.Vector3(0,1,0),car.rotation.y
      ).add(car.position);
      camera.position.lerp(desiredCam,1-Math.pow(0.001,dt));
      lookTarget.copy(car.position);
      lookTarget.y+=1.0;
      smoothLook.lerp(lookTarget,1-Math.pow(0.001,dt));
      camera.lookAt(smoothLook);
    }else{
      desiredCam.set(0,1.55,0.45).applyAxisAngle(
        new THREE.Vector3(0,1,0),car.rotation.y
      ).add(car.position);
      camera.position.copy(desiredCam);
      forwardVec.set(Math.sin(car.rotation.y),0.03,Math.cos(car.rotation.y));
      camera.lookAt(desiredCam.clone().add(forwardVec));
    }
  }else{
    camera.position.lerp(new THREE.Vector3(10,8,18),dt*0.35);
    camera.lookAt(0,0,0);
  }

  $("speed").textContent=String(Math.round(Math.abs(speed)*2.3)).padStart(3,"0");
  $("gear").textContent=speed<-0.5?"GEAR R · REVERSE":"GEAR D · SPORT";

  renderer.render(scene,camera);
}

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

animate();
$("loadStatus").textContent="3D ENGINE READY · ENTER WHEN READY";
</script>
</body>
</html>
