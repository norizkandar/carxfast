
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b10">

  <title>INOVAX: Street Legends</title>
  <meta name="description" content="Explore the streets in INOVAX: Street Legends, a 3D open-world street racing prototype.">

  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div id="loading">
    <div>
      <strong>INOVAX</strong>
      <p>STREET LEGENDS<br>INITIALIZING CITY...</p>
      <p id="error"></p>
    </div>
  </div>

  <div id="hud">
    <div class="brand">
      <strong>INOVAX <span style="color:#76d7ff">/ SL</span></strong>
      <span>STREET LEGENDS</span>
      <br>
      <div class="pill">
        FREE ROAM <span style="color:#6ee7a0">● PROTOTYPE</span>
      </div>
    </div>

    <div id="message">EXPLORE THE CITY</div>

    <button id="reset">RESET CAR ↻</button>

    <div id="help">
      <b>DRIVING CONTROLS</b><br>
      W / ↑ — ACCELERATE<br>
      S / ↓ — BRAKE / REVERSE<br>
      A D / ← → — STEER<br>
      SPACE — HANDBRAKE<br>
      R — RESET VEHICLE
    </div>

    <div id="speedBox">
      <div id="speed">000</div>
      <div id="unit">KM/H</div>
      <div id="gear">GEAR · N</div>
    </div>
  </div>

  <div id="touch">
    <div class="pad" id="steer">
      <button class="ctrl" data-control="left">◀</button>
      <button class="ctrl" data-control="right">▶</button>
    </div>

    <div class="pad" id="pedals">
      <button class="ctrl" data-control="brake">BRAKE</button>
      <button class="ctrl" data-control="gas">GAS</button>
    </div>
  </div>

  <script type="module" src="./game.js"></script>

</body>
</html>
